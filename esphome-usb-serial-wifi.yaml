esphome:
  name: esphome-tcp-proxy-74de28
  friendly_name: ESPHome TCP Proxy 74de28
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_USB_HOST_HUBS_SUPPORTED: "y"
      CONFIG_USB_HOST_HUB_MULTI_LEVEL: "y"
      CONFIG_ESP_USB_OTG_ENABLED: "y"
      CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE: "256"

logger:
  hardware_uart: UART0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.0.0.78
    gateway: 10.0.0.1
    subnet: 255.255.255.0

web_server:
  port: 80

external_components:
  - source:
      type: local
      path: esphome_components
    components: [stream_server, usb_host, usb_uart, usb_ip]

usb_host:
  enable_hubs: true
  max_transfer_requests: 32

usb_uart:
  - type: cp210x
    vid: 0x10C4
    pid: 0xEA60
    channels:
      - id: zigbee_channel
        baud_rate: 115200
        buffer_size: 1024

stream_server:
  uart_id: zigbee_channel
  port: 6638

# Bluetooth dongle (Realtek RTL8761BUV)
# On HA host: sudo modprobe vhci-hcd && sudo usbip attach -r 10.0.0.78 -b 1-1
usb_ip:
  vid: 0x0BDA
  pid: 0xA728
  port: 3240
